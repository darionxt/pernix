name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - name: Install the browser engine
        run: uv run patchright install --with-deps --no-shell chromium
      - name: Diagnose the browser tests (temporary)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        env:
          DEBUG: "pw:api,pw:browser*"
        run: >-
          uv run pytest tests/test_browser_fetcher.py tests/test_crawl_render.py tests/test_launched_browser.py
          -v -o log_cli=true --log-cli-level=DEBUG -o faulthandler_timeout=60
      - run: uv run pytest
