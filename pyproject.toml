[project]
name = "pernix"
version = "0.1.0.dev0"
description = "An asyncio crawling framework with HTTP and browser fetching as peers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "ada-url>=4.0",
    "charset-normalizer>=3.4",
    "curl-cffi>=0.16.3",
    "msgspec>=0.21",
    "orjson>=3.12",
    "packaging>=24",
    "parsel>=1.12",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]

[project.scripts]
pernix = "pernix.cli:main"

[project.entry-points.pytest11]
pernix = "pernix.testing.pytest_plugin"

[project.urls]
Repository = "https://github.com/darionxt/pernix"

[project.optional-dependencies]
browser = [
    "patchright==1.62.3",
]

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "attrs>=25.3",
    "brotli>=1.2.0",
    "pernix[browser]",
    "pydantic>=2.11",
    "pyright>=1.1.414",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
    "zstandard>=0.25.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.format]
# Code in Markdown docs is illustrative and laid out for reading.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "RUF",      # ruff-specific
    "ASYNC",    # async pitfalls
    "PT",       # pytest style
    "PERF",     # performance anti-patterns
    "TC",       # type-checking imports
    "S",        # security
    "D",        # docstrings
]
ignore = [
    "E501",  # line length is handled by the formatter
    "D100",  # module docstrings are optional
    "D104",  # package docstrings are optional
    "D105",  # magic methods are self-describing
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S310", "D"]  # asserts; urllib against the loopback server; no docstring rules
"src/pernix/testing/**" = ["S101", "D102"]  # test suites shipped for other packages: asserts, self-describing test names

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.uv.sources]
pernix = { workspace = true }
